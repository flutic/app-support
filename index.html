<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Support</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --accent: #0066cc;
    --border: #e5e5e5;
    --card-bg: #f7f7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --text: #f0f0f0;
      --muted: #999999;
      --accent: #5eabff;
      --border: #333333;
      --card-bg: #252525;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    margin: 0;
    padding: 2rem 1rem;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.25rem;
  }
  .tagline {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 1.05rem;
  }
  h2 {
    font-size: 1.25rem;
    margin: 2.5rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  p { margin: 0.75rem 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .contact {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  .contact a {
    font-weight: 600;
    word-break: break-all;
  }
  details {
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 0;
  }
  details:last-of-type { border-bottom: none; }
  details summary {
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    padding-right: 1.5rem;
    position: relative;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after {
    content: "+";
    position: absolute;
    right: 0;
    top: 0;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
  }
  details[open] summary::after { content: "−"; }
  details p {
    margin-top: 0.6rem;
    color: var(--muted);
  }
  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.9rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>App Support</h1>
  <p class="tagline">Support and privacy pages for these apps.</p>

  <h2>CarcBot</h2>
  <p><a href="carcbot-support.html">Support</a> &middot; <a href="carcbot-privacy.html">Privacy policy</a></p>
  <h2>ImageCarl</h2>
  <p><a href="imagecarl-support.html">Support</a> &middot; <a href="imagecarl-privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
